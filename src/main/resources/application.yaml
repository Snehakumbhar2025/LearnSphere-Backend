spring:
  application:
    name: LearnSphere-Backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/learnsphere_db}
    username: ${DB_USERNAME:spring}
    password: ${DB_PASSWORD:change-me}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: INFO


# ================= GEMINI AI =================

gemini:
  api:
    key: ${GEMINI_API_KEY}


# ================= PAYMENT =================

payment:
  mode: mock